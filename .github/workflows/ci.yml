name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Python unit tests (pytest)
        # Fast: no warehouse required — ingestion clients are tested against mocked responses.
        run: pytest tests/ -v

  dbt-build:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dbt (DuckDB adapter)
        run: |
          python -m pip install --upgrade pip
          pip install dbt-core dbt-duckdb dbt_utils || pip install dbt-core dbt-duckdb

      - name: dbt deps
        working-directory: dbt
        run: dbt deps

      - name: dbt compile (whole project parses & compiles)
        # Structural check across every model, including those whose sources need landed data.
        working-directory: dbt
        run: dbt compile --target ci --profiles-dir .

      - name: dbt build — dimension slice (executes for real, from committed seeds)
        # The conformed dimensions build with NO extraction and NO database state: seeds ->
        # snapshot -> dims -> tests, all from files in the repo. indirect-selection=cautious
        # keeps fact-table tests (which need landed data) out of the selection.
        working-directory: dbt
        run: |
          dbt build --target ci --profiles-dir . --indirect-selection=cautious \
            --select seed_companies country_regions currency_names company_snapshot \
                     dim_company dim_country dim_currency dim_date
