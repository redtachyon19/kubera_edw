name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Python unit tests (pytest)
        # Fast: no warehouse required — ingestion clients are tested against mocked responses.
        run: pytest tests/ -v

  dbt-compile:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dbt (DuckDB adapter)
        run: |
          python -m pip install --upgrade pip
          pip install dbt-core dbt-duckdb

      - name: dbt compile (validate the project parses & compiles)
        # Scaffold stage: no landed/seeded data yet, so we validate structure only —
        # this catches bad refs/sources, Jinja errors, and SQL that won't compile.
        # Full `dbt build` (execute models + run dbt tests) returns in Phase 2/5 once
        # seed/sample data is committed.
        working-directory: dbt
        run: dbt compile --target ci --profiles-dir .
