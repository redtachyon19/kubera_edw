name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (ruff)
        run: ruff format --check .

      - name: Python unit tests (pytest)
        run: pytest tests/ -v

  dbt-build:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dbt (DuckDB adapter)
        run: |
          python -m pip install --upgrade pip
          pip install dbt-core dbt-duckdb dbt_utils || pip install dbt-core dbt-duckdb

      - name: dbt deps
        working-directory: dbt
        run: dbt deps

      - name: dbt seed (load committed CI fixtures into the raw schema)
        working-directory: dbt
        run: dbt seed --target ci --profiles-dir .

      - name: dbt build — full DAG offline
        working-directory: dbt
        run: dbt build --target ci --profiles-dir .
