name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Python unit tests (pytest)
        # Fast: no warehouse required — ingestion clients are tested against mocked responses.
        run: pytest tests/ -v

  dbt-build:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dbt (DuckDB adapter)
        run: |
          python -m pip install --upgrade pip
          pip install dbt-core dbt-duckdb

      - name: dbt deps + build (DuckDB, seeded sample)
        # Runs staging→marts against a local DuckDB with committed seed/sample data,
        # then executes dbt-native tests (not_null, unique, relationships, reconciliation).
        working-directory: dbt
        run: |
          dbt deps
          dbt build --target ci
