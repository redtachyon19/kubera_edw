name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (ruff)
        # Stricter than `ruff check`: catches drift in formatting that lint alone allows.
        run: ruff format --check .

      - name: Python unit tests (pytest)
        # Fast: no warehouse required — ingestion clients are tested against mocked responses.
        run: pytest tests/ -v

  dbt-build:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dbt (DuckDB adapter)
        run: |
          python -m pip install --upgrade pip
          pip install dbt-core dbt-duckdb dbt_utils || pip install dbt-core dbt-duckdb

      - name: dbt deps
        working-directory: dbt
        run: dbt deps

      - name: dbt seed (load committed CI fixtures into the raw schema)
        # Seeds run as their own step, not via `dbt build`: dbt has no DAG edge from a
        # source() to the seed that populates it, so in a single build it would schedule the
        # staging models in parallel with the seeds and hit a missing table.
        working-directory: dbt
        run: dbt seed --target ci --profiles-dir .

      - name: dbt build — full DAG offline
        # seeds -> staging -> intermediate -> marts -> snapshots -> every test, with NO API
        # keys, NO network and NO extraction run. The reconciliation test is severity=warn and
        # is EXPECTED to fire on the deliberately-broken filer in the fixtures.
        working-directory: dbt
        run: dbt build --target ci --profiles-dir .
