version: 2

# Staging-layer tests: type/shape guarantees only. Business-rule tests live on the marts.
models:
  - name: stg_sec_edgar__financials
    description: One row per company per taxonomy/concept per unit per reported period.
    columns:
      - name: cik
        tests: [not_null]
      - name: period_end_date
        tests: [not_null]
      - name: taxonomy
        description: >
          Both namespaces appear, and not only across companies — Toyota MIGRATED from us-gaap
          (FY2009-2020) to ifrs-full (FY2021-2025), so a single company spans both.
        tests:
          - accepted_values:
              arguments:
                values: [us-gaap, ifrs-full, srt, invest, ecd, ffd]

  - name: stg_world_bank__macro
    columns:
      - name: country_iso3
        tests: [not_null]
      - name: calendar_year
        tests: [not_null]

  - name: stg_fx__rates
    description: Daily USD-base FX rates.
    tests:
      # One rate per currency per day. Without this, an accumulated second landing file
      # silently doubles rates and fans out every fact that joins to them.
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [rate_date, currency_iso]
    columns:
      - name: rate_date
        tests: [not_null]
      - name: currency_iso
        description: >
          Deliberately NOT an accepted_values list. The pulled currency set is derived from
          companies.yml and changes on every scale-out, so a hardcoded enumeration goes stale
          and fails for the wrong reason (it did exactly that when the universe went 9 -> 38).
          Integrity is enforced instead by assert_fx_currencies_are_modelled, which checks the
          set against dim_currency — the dimension that is supposed to define it.
        tests: [not_null]
      - name: rate_per_usd
        description: Units of the foreign currency per 1 USD — divide to convert into USD.
        tests: [not_null]

  - name: stg_gold__prices
    columns:
      - name: price_date
        tests: [not_null, unique]

  - name: stg_prices__daily
    columns:
      - name: trade_date
        tests: [not_null]
      - name: ticker
        tests: [not_null]

  - name: stg_imf__macro
    columns:
      - name: country_iso3
        tests: [not_null]
      - name: calendar_year
        tests: [not_null]
