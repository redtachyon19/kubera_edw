version: 2

sources:
  - name: raw
    description: Raw responses parsed from data/raw/ into tidy tables — no business logic.
    schema: raw
    tables:
      - name: sec_edgar_facts
        description: >
          Flattened company XBRL facts (10-K/10-Q, 20-F/6-K). One row per company per
          taxonomy/concept per unit per reported period. Both us-gaap and ifrs-full appear.
      - name: world_bank_macro
        description: Country-year macro indicators, carrying loaded_at for revision auditing.
      - name: world_bank_countries
        description: >
          Country reference — name, region, income band, capital city and its coordinates.
          One row per country, deduplicated to the most recent landing.
      - name: fx_rates
        description: Daily FX rates unpivoted to (rate_date, currency, rate_per_base), base USD.
      - name: gold_prices
        description: LBMA daily gold fixing from FRED; value_raw keeps "." missing markers.
      - name: market_prices
        description: Daily OHLCV from the Stooq or Alpha Vantage backend.
      - name: imf_macro
        description: IMF DataMapper cross-check indicators, scoped to universe countries.
