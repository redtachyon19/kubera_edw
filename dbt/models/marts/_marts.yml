version: 2

models:
  - name: dim_company
    description: One row per company VERSION (SCD Type 2 on classification changes).
    columns:
      - name: company_key
        description: Surrogate key over (ticker, effective_from) — unique per version.
        tests: [not_null, unique]
      - name: ticker
        description: Not unique here by design — one ticker has one row per version.
        tests: [not_null]
      - name: cik
        tests: [not_null]
      - name: is_current
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [true, false]
      - name: effective_from
        tests: [not_null]
      - name: filer_type
        tests:
          - accepted_values:
              arguments:
                values: ["10-K", "20-F"]
      - name: xbrl_taxonomy
        description: Verified per company; BABA files 20-F yet tags under us-gaap.
        tests:
          - accepted_values:
              arguments:
                values: [us-gaap, ifrs-full]
      - name: reporting_currency
        tests: [not_null]

  - name: dim_country
    columns:
      - name: country_key
        tests: [not_null, unique]
      - name: iso3_code
        tests: [not_null, unique]
      - name: region
        description: >
          The country_regions seed where it has an opinion, otherwise the World Bank region
          folded onto the same house vocabulary. Null would mean a country reached the
          dimension from neither source.
        tests: [not_null]
      - name: has_issuer
        description: >
          True for the countries that hold a company in seed_companies. The dimension covers
          every country the macro feed publishes, so this is what narrows it back to the
          portfolio when a model wants only those.
        tests: [not_null]

  - name: dim_date
    columns:
      - name: date_key
        tests: [not_null, unique]
      - name: full_date
        tests: [not_null, unique]
      - name: calendar_quarter
        tests:
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4]

  - name: dim_currency
    columns:
      - name: currency_key
        tests: [not_null, unique]
      - name: iso_code
        tests: [not_null, unique]
      - name: currency_name
        tests: [not_null]

  - name: fact_financials
    description: >
      One row per company per fiscal filing period. Cadence is deliberately mixed: US domestic
      filers contribute FY and Q rows, foreign private issuers largely FY only.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [ticker, period_end_date, period_type]
    columns:
      - name: company_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_company')
                field: company_key
      - name: date_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key
      - name: period_type
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [FY, Q]
      - name: reporting_currency
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_currency')
                field: iso_code
      - name: rate_per_usd
        description: >
          USD reporters sit at exactly 1.0; only TM (JPY) and BABA (CNY) truly convert.
          Deliberately NOT not_null: TM and BABA have filing history from 2008/2013, while the
          FX pull starts 2014-12-31, so those early periods have no rate and are honestly left
          unconverted rather than given a fabricated one. See assert_usd_reporters_rate_is_one.

  - name: fact_market_prices
    description: One row per company per trading day. Empty pending ALPHA_VANTAGE_API_KEY.
    columns:
      - name: company_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_company')
                field: company_key
      - name: date_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key

  - name: fact_macro_indicators
    description: One row per country per year, anchored to the Dec 31 date_key.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [country_iso3, calendar_year]
    columns:
      - name: country_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_country')
                field: country_key
      - name: date_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key
      - name: calendar_year
        tests: [not_null]

  - name: fact_gold_price
    description: Single global daily USD series; joined only on dim_date.
    columns:
      - name: date_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key
