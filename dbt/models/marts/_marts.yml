version: 2

# dbt-native tests on the warehouse (Phase 5). not_null / unique on keys, and relationships
# (referential integrity) from every fact FK back to its conformed dimension.
# Generic-test arguments are nested under `arguments:` per dbt 1.10+ conventions.
models:
  - name: dim_company
    description: One row per company version (SCD Type 2 on classification changes).
    columns:
      - name: company_key
        description: Surrogate key (unique per company version).
        tests: [not_null, unique]
      # These columns arrive in Phase 3 when dim_company becomes a real SCD Type 2 dimension.
      # The tests are written now and enabled then — a stub has only company_key, so running
      # them today errors on a missing column rather than testing anything.
      - name: ticker
        tests:
          - not_null:
              config: {enabled: false}   # TODO(phase-3): enable with the SCD2 build
      - name: is_current
        tests:
          - accepted_values:
              arguments:
                values: [true, false]
              config: {enabled: false}   # TODO(phase-3): enable with the SCD2 build

  - name: dim_country
    columns:
      - name: country_key
        tests: [not_null, unique]

  - name: dim_date
    columns:
      - name: date_key
        tests: [not_null, unique]

  - name: dim_currency
    columns:
      - name: currency_key
        tests: [not_null, unique]

  - name: fact_financials
    description: One row per company per fiscal filing period (mixed quarterly/annual).
    columns:
      - name: company_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_company')
                field: company_key

  - name: fact_market_prices
    columns:
      - name: company_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_company')
                field: company_key

  - name: fact_macro_indicators
    columns:
      - name: country_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_country')
                field: country_key

  - name: fact_gold_price
    description: Single global daily USD series; joined only on dim_date.
    columns:
      - name: date_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key
