version: 2

# dbt-native tests on the warehouse (Phase 5). not_null / unique on keys, and relationships
# (referential integrity) from every fact FK back to its conformed dimension.
# Generic-test arguments are nested under `arguments:` per dbt 1.10+ conventions.
models:
  - name: dim_company
    description: One row per company VERSION (SCD Type 2 on classification changes).
    columns:
      - name: company_key
        description: Surrogate key over (ticker, effective_from) — unique per version.
        tests: [not_null, unique]
      - name: ticker
        description: Not unique here by design — one ticker has one row per version.
        tests: [not_null]
      - name: cik
        tests: [not_null]
      - name: is_current
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [true, false]
      - name: effective_from
        tests: [not_null]
      - name: filer_type
        tests:
          - accepted_values:
              arguments:
                values: ["10-K", "20-F"]
      - name: xbrl_taxonomy
        description: Verified per company; BABA files 20-F yet tags under us-gaap.
        tests:
          - accepted_values:
              arguments:
                values: [us-gaap, ifrs-full]
      - name: reporting_currency
        tests: [not_null]

  - name: dim_country
    columns:
      - name: country_key
        tests: [not_null, unique]
      - name: iso3_code
        tests: [not_null, unique]
      - name: region
        description: Sourced from the country_regions seed; null would mean an unseeded country.
        tests: [not_null]

  - name: dim_date
    columns:
      - name: date_key
        tests: [not_null, unique]
      - name: full_date
        tests: [not_null, unique]
      - name: calendar_quarter
        tests:
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4]

  - name: dim_currency
    columns:
      - name: currency_key
        tests: [not_null, unique]
      - name: iso_code
        tests: [not_null, unique]
      - name: currency_name
        tests: [not_null]

  - name: fact_financials
    description: One row per company per fiscal filing period (mixed quarterly/annual).
    columns:
      - name: company_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_company')
                field: company_key

  - name: fact_market_prices
    columns:
      - name: company_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_company')
                field: company_key

  - name: fact_macro_indicators
    columns:
      - name: country_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_country')
                field: country_key

  - name: fact_gold_price
    description: Single global daily USD series; joined only on dim_date.
    columns:
      - name: date_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key
