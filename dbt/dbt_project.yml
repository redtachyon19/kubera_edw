name: kubera_edw
version: "0.1.0"
config-version: 2

profile: kubera_edw

model-paths: ["models"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

vars:
  date_spine_start: "2000-01-01"
  date_spine_end: "2031-01-01"

  fx_max_carry_forward_days: 7

seeds:
  kubera_edw:
    seed_companies:
      +column_types:
        cik: varchar
        industry: varchar
        valid_from: date

    ci_raw:
      +schema: raw
      +enabled: "{{ target.name == 'ci' }}"
      sec_edgar_facts:
        +column_types:
          cik: varchar
          period_start: date
          period_end: date
          filed_date: date
          value: double precision
      gold_prices:
        +column_types:
          value_raw: varchar
      market_prices:
        +column_types:
          ticker: varchar
          trade_date: date

      # Trade fixtures. Both overrides below exist because DuckDB's CSV sniffer
      # gets these wrong in ways that only surface at seed time:
      #   * PortWatch's disruption dates are epoch MILLISECONDS, which overflow
      #     a 32-bit INTEGER — the sniffer picks INTEGER and the load fails.
      #   * Its `date` column arrives as a "YYYY-MM-DD" string and the staging
      #     models cast it themselves, so it is held as text to match what the
      #     Parquet loader puts in Postgres.
      portwatch_disruptions:
        +column_types:
          eventid: bigint
          fromdate: bigint
          todate: bigint
          editdate: bigint
          affectedports: varchar
      portwatch_port_daily:
        +column_types:
          date: varchar
          portid: varchar
      portwatch_chokepoint_daily:
        +column_types:
          date: varchar
          portid: varchar
      portwatch_ports:
        +column_types:
          portid: varchar
          locode: varchar
      portwatch_chokepoints:
        +column_types:
          portid: varchar
      portwatch_trade_ribbons:
        +column_types:
          from_portid: varchar
          hs_section: varchar

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  kubera_edw:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts
