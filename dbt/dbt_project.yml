name: kubera_edw
version: "0.1.0"
config-version: 2

profile: kubera_edw

model-paths: ["models"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

vars:
  date_spine_start: "2000-01-01"
  date_spine_end: "2031-01-01"

  fx_max_carry_forward_days: 7

seeds:
  kubera_edw:
    seed_companies:
      +column_types:
        cik: varchar
        industry: varchar
        valid_from: date

    ci_raw:
      +schema: raw
      +enabled: "{{ target.name == 'ci' }}"
      sec_edgar_facts:
        +column_types:
          cik: varchar
          period_start: date
          period_end: date
          filed_date: date
          value: double precision
      gold_prices:
        +column_types:
          value_raw: varchar
      market_prices:
        +column_types:
          ticker: varchar
          trade_date: date

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  kubera_edw:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts
