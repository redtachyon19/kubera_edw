
services:
  warehouse:
    image: postgres:16
    container_name: kubera_warehouse
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - warehouse_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  orchestrator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kubera_orchestrator
    command: dagster dev -h 0.0.0.0 -p 3000 -f orchestration/dagster_pipeline.py
    env_file: .env
    environment:
      DBT_TARGET: prod
      POSTGRES_HOST: warehouse
      POSTGRES_PORT: 5432
      RAW_DATA_DIR: /app/data/raw
      DAGSTER_HOME: /app/dagster_home
    depends_on:
      warehouse:
        condition: service_healthy
    ports:
      - "3000:3000"
    volumes:
      - ./:/app

  bi:
    image: metabase/metabase:latest
    container_name: kubera_bi
    depends_on:
      warehouse:
        condition: service_healthy
    ports:
      - "3001:3000"

volumes:
  warehouse_data:
