<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Kubera — Finance Dashboard Hub. Research, analytics and capital-markets reporting."
    />
    <title>KUBERA · Finance Dashboard Hub</title>
    <script>
      // Stamp the stored stock before first paint, so a dark-mode reader never
      // gets a white flash on load.
      (function () {
        try {
          var stored = localStorage.getItem('kubera-theme');
          var mode = stored === 'dark' ? 'dark' : 'light';
          document.documentElement.setAttribute('data-theme', mode);
        } catch (e) {
          /* private mode — keep the light default already on <html> */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
