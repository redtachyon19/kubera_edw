# Kubera coverage universe.
#
# Phase 0 (Scope lock): this 9-company / 5-country subset (USA, GBR, JPN, IND, CHN) is the
# proving ground; once the pipeline runs end-to-end, scale out to the full ~40-name universe (§6).
#
# SCOPE REVISION 2026-07-24 (Phase 1): TSM/Taiwan was DROPPED and replaced by INFY (India) and
#   BABA (China). Rationale: TSM reports in TWD, and TWD is absent from Frankfurter's 30-currency
#   set, so its financials could not be USD-normalized at all — breaking the core FX-contribution
#   KPI (§10), not merely leaving a macro hole. Taiwan also had no World Bank coverage. Both
#   replacements have full World Bank + Frankfurter coverage. BABA additionally restores a second
#   reporting currency (CNY) that genuinely exercises FX normalization; without it, Toyota's JPY
#   would be the only company converting at all.
#
# SCOPE-LOCK PROVENANCE: verified 2026-07-24 against SEC EDGAR
#   (User-Agent "Kubera EDW ishanvemireddy@icloud.com") — company_tickers.json for CIKs,
#   submissions API for filer type + fiscal year end, companyfacts XBRL units for reporting
#   currency + taxonomy. Re-verify before scale-out; filer status/CIKs change (M&A, reorg).
#
# FIELD SEMANTICS:
#   cik                 zero-padded 10-digit SEC CIK (quoted so YAML keeps leading zeros).
#   currency            DOMESTIC currency of the country — drives dim_currency + macro/FX narrative.
#   reporting_currency  currency the company PRESENTS its SEC financials in (from XBRL units)
#                       — drives fact_financials measures + FX normalization. NOTE: AZN and SHEL
#                       report in USD, so FX normalization is a no-op for them (not GBP!).
#   xbrl_taxonomy       taxonomy the company's facts actually appear under, verified from
#                       companyfacts — NOT inferable from filer_type: BABA files a 20-F but tags
#                       under us-gaap, and TM carries BOTH ifrs-full and us-gaap. This is exactly
#                       why sec_edgar_client walks both namespaces (see CONCEPT_TAG_MAP).
#   fiscal_year_end     MM-DD; cadence is mixed (10-Q quarterly for US, 20-F annual-only for foreign).
#
# FX NORMALIZATION SCOPE (drives Phase 4): only TM (JPY) and BABA (CNY) report in a non-USD
#   currency. AZN, SHEL and INFY are foreign issuers that nonetheless present their SEC
#   financials in USD, so conversion is a deliberate no-op for them — not a missing rate.
#
# KNOWN COVERAGE GAPS for this locked scope (design around, don't ignore — §11).
# Status below re-confirmed empirically against landed data during Phase 1 (2026-07-24):
#   - RESOLVED: the Taiwan World Bank gap and the TWD FX gap disappeared with the TSM swap.
#     Every remaining country (USA, GBR, JPN, IND, CHN) has World Bank coverage, and every
#     remaining currency (USD, GBP, JPY, INR, CNY) is served by Frankfurter — all verified live.
#   - Mixed fiscal-year-ends (Apple Sep, Microsoft Jun, Toyota/Infosys/Alibaba Mar, rest Dec).
#   - PRICES: stooq.com now gates its CSV endpoint behind a JavaScript proof-of-work bot
#     check (confirmed 2026-07-24), so it is no longer a usable keyless source. Alpha Vantage
#     (free key, ~25 req/day) is the price backend; note TIME_SERIES_DAILY_ADJUSTED is premium,
#     so the free TIME_SERIES_DAILY endpoint is used.
#   DECISION: keep TSM/Taiwan (best portfolio narrative) and accept the documented macro+FX gap.

benchmarks:
  # Benchmark tickers used for relative-performance KPIs (not held positions).
  # ETFs — routed through prices_client only; no SEC CIK / companyfacts.
  sector_or_index:
    - SPY   # S&P 500 proxy
    - ACWI  # MSCI ACWI (global) proxy

companies:
  # --- North America (domestic 10-K/10-Q filers, us-gaap, USD) ---
  - ticker: AAPL
    cik: "0000320193"
    legal_name: Apple Inc.
    country: United States
    country_iso3: USA
    currency: USD
    reporting_currency: USD
    sector: Technology
    filer_type: 10-K
    fiscal_year_end: "09-26"
    xbrl_taxonomy: us-gaap

  - ticker: MSFT
    cik: "0000789019"
    legal_name: Microsoft Corporation
    country: United States
    country_iso3: USA
    currency: USD
    reporting_currency: USD
    sector: Technology
    filer_type: 10-K
    fiscal_year_end: "06-30"
    xbrl_taxonomy: us-gaap

  - ticker: JPM
    cik: "0000019617"
    legal_name: JPMorgan Chase & Co.
    country: United States
    country_iso3: USA
    currency: USD
    reporting_currency: USD
    sector: Financials
    filer_type: 10-K
    fiscal_year_end: "12-31"
    xbrl_taxonomy: us-gaap

  - ticker: XOM
    # Ticker XOM now resolves in company_tickers.json to CIK 0002115436
    # ("ExxonMobil Holdings Corp") — a reorg successor with only 8-K/S-8 and NO 10-K/XBRL
    # history. Pinned to the operating entity 0000034088 ("EXXON MOBIL CORP", latest 10-K
    # 2026-02-18) which carries the us-gaap fundamentals. SEC client must prefer this pinned
    # cik and only fall back to resolve_cik(ticker) when cik is null.
    cik: "0000034088"
    legal_name: Exxon Mobil Corporation
    country: United States
    country_iso3: USA
    currency: USD
    reporting_currency: USD
    sector: Energy
    filer_type: 10-K
    fiscal_year_end: "12-31"
    xbrl_taxonomy: us-gaap

  # --- Europe (foreign private issuers, 20-F, ifrs-full; present financials in USD) ---
  - ticker: AZN
    cik: "0000901832"
    legal_name: AstraZeneca PLC
    country: United Kingdom
    country_iso3: GBR
    currency: GBP
    reporting_currency: USD   # AstraZeneca presents SEC financials in USD, not GBP
    sector: Healthcare
    filer_type: 20-F
    fiscal_year_end: "12-31"
    xbrl_taxonomy: ifrs-full

  - ticker: SHEL
    cik: "0001306965"
    legal_name: Shell plc
    country: United Kingdom   # Re-domiciled from Netherlands to the UK in 2022 -> GBR
    country_iso3: GBR
    currency: GBP
    reporting_currency: USD   # Shell presents SEC financials in USD, not GBP
    sector: Energy
    filer_type: 20-F
    fiscal_year_end: "12-31"
    xbrl_taxonomy: ifrs-full

  # --- Asia-Pacific (foreign private issuers, 20-F, ifrs-full) ---
  - ticker: TM
    cik: "0001094517"
    legal_name: Toyota Motor Corporation
    country: Japan
    country_iso3: JPN
    currency: JPY
    reporting_currency: JPY
    sector: Consumer Discretionary
    filer_type: 20-F
    fiscal_year_end: "03-31"
    xbrl_taxonomy: ifrs-full

  - ticker: INFY
    cik: "0001067491"
    legal_name: Infosys Ltd
    country: India
    country_iso3: IND
    currency: INR
    reporting_currency: USD   # Infosys presents its SEC financials in USD, not INR
    sector: Technology
    filer_type: 20-F
    fiscal_year_end: "03-31"
    xbrl_taxonomy: ifrs-full

  - ticker: BABA
    cik: "0001577552"
    legal_name: Alibaba Group Holding Ltd
    country: China
    country_iso3: CHN
    currency: CNY
    reporting_currency: CNY   # reports in CNY — one of only two names needing FX conversion
    sector: Technology
    filer_type: 20-F
    # NOTE: files a 20-F but tags under us-gaap, not ifrs-full — the counterexample proving
    # taxonomy cannot be inferred from filer type.
    xbrl_taxonomy: us-gaap
    fiscal_year_end: "03-31"
