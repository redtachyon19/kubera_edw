# Kubera coverage universe.
#
# Phase 0 (Scope lock): start with this 8-company / 5-country subset, prove the pipeline
# end-to-end, THEN scale out to the full ~40-name universe (see docs/project_spec.md §6).
#
# IMPORTANT: filer status (10-K vs 20-F), tickers, and CIKs change (delistings, M&A,
# re-domestications). Re-verify each on SEC EDGAR before wiring extraction:
#   https://www.sec.gov/cgi-bin/browse-edgar
# CIK is left null until confirmed — the SEC client resolves ticker → CIK and should
# fail loudly rather than guess.

benchmarks:
  # Benchmark tickers used for relative-performance KPIs (not held positions).
  sector_or_index:
    - SPY   # S&P 500 proxy
    - ACWI  # MSCI ACWI (global) proxy

companies:
