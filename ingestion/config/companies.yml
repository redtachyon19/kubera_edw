# Kubera coverage universe — FULL SCALE-OUT.
#
# 38 companies across 13 countries. Expanded from the 9-company proving subset in Phase 8,
# after verifying every candidate against the sources that actually feed the warehouse
# (scripts/verify_universe.py — re-run it before any further change to this file).
#
# SCOPE PROVENANCE: verified 2026-07-25 against SEC EDGAR (company_tickers.json for CIKs,
#   submissions for filer type + fiscal year end, companyfacts XBRL units for reporting
#   currency + taxonomy), plus live World Bank and Frankfurter coverage checks.
#
# FIELD SEMANTICS:
#   cik                 zero-padded 10-digit SEC CIK (quoted so YAML keeps leading zeros).
#   currency            DOMESTIC currency of the country — drives dim_currency + macro context.
#   reporting_currency  currency the company PRESENTS its SEC financials in, READ FROM THE XBRL
#                       UNITS. Domicile does NOT imply this: 12 of 38 companies file in a
#                       currency other than their home one (most foreign issuers file in USD;
#                       Unilever, a UK company, files in EUR). Getting this wrong double-converts.
#   xbrl_taxonomy       taxonomy the facts actually appear under, VERIFIED — not inferable from
#                       filer_type. 10 companies carry BOTH us-gaap and ifrs-full, and several
#                       20-F filers (ASML, BABA, BIDU, JD, MUFG, SONY) tag under us-gaap.
#   fiscal_year_end     MM-DD. Cadence is mixed: 10-Q quarterly for US filers, annual-only 20-F
#                       for most foreign issuers.
#
# EXCLUDED from the §6 list, with reasons:
#   IBN (ICICI Bank, India) — SEC returns 404 for its companyfacts endpoint; no XBRL financial
#       data exists to model.
#   TSM (Taiwan Semiconductor) — Taiwan has no World Bank macro coverage AND TWD is not served
#       by Frankfurter, so its TWD financials cannot be USD-normalized at all. Same reason it
#       was removed in Phase 1; nothing has changed.
#
# KNOWN GAPS carried into this scope:
#   - Alpha Vantage's free tier allows ~25 price requests/day; 38 companies + 2 benchmarks
#     + the gold proxy exceed that, so price coverage fills in across runs (see notes_for_red.md).
#   - XOM's ticker resolves to a reorg holdco with no 10-K; its operating CIK is pinned below.

benchmarks:
  # Benchmark tickers for relative-performance KPIs (not held positions). ETFs — no SEC CIK.
  sector_or_index:
    - SPY   # S&P 500 proxy
    - ACWI  # MSCI ACWI (global) proxy

